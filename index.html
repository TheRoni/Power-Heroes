<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5db7f2">
  <title>Power Heroes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <!-- The 3D picture is drawn here. -->
  <canvas id="game"></canvas>

  <!-- A grey veil over the picture. The island is washed-out until the Gloomlings are beaten. -->
  <div id="tint" aria-hidden="true"></div>

  <!-- The on-screen joystick. It appears wherever a thumb touches the left half of the screen. -->
  <div id="joystick" aria-hidden="true"><div id="joystick-knob"></div></div>

  <!-- A short hint that fades away once you start moving. -->
  <p id="hint">
    <span class="hint-touch">Drag left to move · tap the big button</span>
    <span class="hint-keys">W A S D or arrows to move · Space for your power</span>
  </p>

  <!-- The heads-up display: the hero's health. -->
  <div id="hud">
    <div id="hud-hero">
      <span id="hud-name">Sol</span>
      <div id="hud-bar"><div id="hud-fill"></div></div>
    </div>
    <div id="hud-wave"></div>
  </div>

  <!-- Numbers that pop up over the action. -->
  <div id="floaters" aria-hidden="true"></div>

  <!-- The hero's superpower button (Space on a keyboard). The dark sweep shows the recharge. -->
  <button id="power-button" type="button" aria-label="Starburst" data-power="starburst">
    <svg class="icon-flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 5.5 5 10.5a5 5 0 0 1-10 0c0-2 1-3.4 2-4.5.2 1.3.9 2.2 1.8 2.6C10.2 8.2 10.5 4.7 12 2z"/></svg>
    <svg class="icon-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.3L12 17.8 5.7 21.5l1.7-7.3L2 9.5l7.1-.6z"/></svg>
    <span id="power-label">Starburst</span>
  </button>

  <!-- The title that sweeps across the screen when a wave starts. -->
  <div id="banner" aria-live="polite">
    <div id="banner-title"></div>
    <div id="banner-sub"></div>
  </div>

  <!-- Pip's quick comments during a fight. -->
  <div id="bubble" aria-live="polite"></div>

  <!-- A conversation. Tap, click, Space or Enter goes on to the next line. -->
  <div id="dialogue" hidden role="dialog" aria-live="polite">
    <div id="dialogue-box">
      <div id="dialogue-face"></div>
      <div id="dialogue-body">
        <div id="dialogue-name"></div>
        <p id="dialogue-text"></p>
      </div>
      <div id="dialogue-next" aria-hidden="true"></div>
    </div>
  </div>

  <!-- A short reminder of what to do, shown while a lesson is on. -->
  <div id="lesson" hidden></div>

  <!-- A white flash over the screen (the falling star landing). -->
  <div id="flash" aria-hidden="true"></div>

  <!-- Skips the prologue. Only shown while the prologue is playing. -->
  <button id="skip" type="button" hidden>Skip intro</button>

  <!-- The Mute button (the M key does the same). -->
  <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
  </button>

  <!-- The end screen: "Isle saved!" or "Knocked out", with a button to go again. -->
  <div id="end" hidden role="dialog" aria-modal="true" aria-labelledby="end-title">
    <div id="end-card">
      <h1 id="end-title"></h1>
      <p id="end-text"></p>
      <button id="end-button" type="button"></button>
    </div>
  </div>

  <!-- The title screen: the first tap starts the sound and the story. -->
  <div id="title" hidden>
    <h1 id="title-name">Power Heroes</h1>
    <p id="title-line">A star is about to fall.</p>
    <p id="title-tap"><span class="hint-touch">Tap to begin</span><span class="hint-keys">Click or press Space to begin</span></p>
  </div>

  <!-- Shown only if this device cannot draw 3D graphics. -->
  <p id="message" hidden>Sorry, this device cannot show 3D graphics.</p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
