<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5db7f2">
  <title>Power Heroes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The 3D picture is drawn here. -->
  <canvas id="game"></canvas>

  <!-- The on-screen joystick. It appears wherever a thumb touches the left half of the screen. -->
  <div id="joystick" aria-hidden="true"><div id="joystick-knob"></div></div>

  <!-- A short hint that fades away once you start moving. -->
  <p id="hint">
    <span class="hint-touch">Drag on the left side to move</span>
    <span class="hint-keys">Move with W A S D or the arrow keys</span>
  </p>

  <!-- Shown only if this device cannot draw 3D graphics. -->
  <p id="message" hidden>Sorry, this device cannot show 3D graphics.</p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
